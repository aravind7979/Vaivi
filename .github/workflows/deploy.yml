name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory. Modify this path if your project is located elsewhere on the server!
            cd ~/Vaivi || cd /home/ubuntu/Vaivi || cd /home/ec2-user/Vaivi
            
            # Pull the latest code from the main branch
            git pull origin main
            
            # Rebuild and restart the Docker containers in detached mode
            sudo docker-compose up -d --build
            
            # Optional: Clean up old unused Docker images to free up space
            sudo docker image prune -f
